name: Build Windows

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install Qt 6.11.2
        uses: trollixx/setup-qt@v1
        with:
          version: "6.11.2"

      - name: Configure CMake
        shell: pwsh
        run: |
          cmake -S . -B build `
            -G "Visual Studio 17 2022" `
            -A x64

      - name: Build
        shell: pwsh
        run: |
          cmake --build build `
            --config Release `
            --parallel

      - name: Create package directory
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path package

      - name: Deploy Qt
        shell: pwsh
        run: |
          windeployqt `
            --release `
            --qmldir . `
            --dir package `
            build/Release/appmtgDeckBuilder.exe

      - name: Copy executable
        shell: pwsh
        run: |
          Copy-Item `
            build/Release/appmtgDeckBuilder.exe `
            package/appmtgDeckBuilder.exe

      - name: Create ZIP
        shell: pwsh
        run: |
          Compress-Archive `
            -Path package/* `
            -DestinationPath mtgDeckBuilder-Windows.zip

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: mtgDeckBuilder-Windows
          path: mtgDeckBuilder-Windows.zip
